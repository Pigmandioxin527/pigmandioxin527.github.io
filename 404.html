  border:1px solid var(--navy);background:var(--navy);color:#fff;display:inline-block;
  transition:background .16s ease,transform .16s ease;
}
a.btn:hover{background:var(--signal);border-color:var(--signal);transform:translateY(-2px)}
a.btn:focus-visible{outline:2px solid var(--signal);outline-offset:3px}
svg{display:block;margin:0 auto 30px;width:70px;height:auto}
.sole{fill:none;stroke:var(--rule);stroke-width:3}
